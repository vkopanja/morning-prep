spring:
  application:
    name: morning-prep

  # PostgreSQL Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:morningprep}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  # JPA/Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: ${SHOW_SQL:false}
    open-in-view: false

  # Flyway Migrations
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Jackson JSON - configured in JacksonConfig.java
  # (removed deprecated settings)

# UserGems API Configuration
usergems:
  calendar-api:
    base-url: https://app.usergems.com/api/hiring/calendar-challenge
    timeout-seconds: 30
  person-api:
    base-url: https://app.usergems.com/api/hiring/calendar-challenge
    bearer-token: ${PERSON_API_TOKEN:9d^XItOjTAGSG5ch}
    timeout-seconds: 30
    cache-ttl-days: 30

# Scheduler Configuration
scheduler:
  enabled: ${SCHEDULER_ENABLED:true}
  morning-email-hour: 8

# Logging
logging:
  level:
    com.usergems: INFO
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Server Configuration
server:
  port: ${SERVER_PORT:8080}

# Actuator (Health Checks)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
