services:
  # PostgreSQL Database
  db:
    image: postgres:17-alpine
    container_name: morningprep-db
    environment:
      POSTGRES_DB: morningprep
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d morningprep"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - morningprep-network
    restart: unless-stopped

  # Spring Boot API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: morningprep-api
    environment:
      # Database connection
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: morningprep
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      # API tokens
      PERSON_API_TOKEN: "9d^XItOjTAGSG5ch"
      # Application settings
      SCHEDULER_ENABLED: "true"
      SPRING_PROFILES_ACTIVE: docker
      # JVM options
      JAVA_OPTS: "-Xmx512m -Xms256m"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - morningprep-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  morningprep-network:
    driver: bridge
